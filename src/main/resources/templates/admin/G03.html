<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>アドミン権限専用</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="header border-bottom mt-2">
			<h1 class="h2">アドミン専用画面</h1>
		</div>

		<h4 style="margin-bottom: 20px;">ユーザリスト</h4>
		<br>
		<form method="post" th:action="@{/admin/G03}">
			<table border="0">
				<tr>
					<td>ユーザID</td>
					<td><input type="text" class="form-control" name="userId" /></td>
					<td>ユーザ名</td>
					<td><input type="text" class="form-control" name="userName" /></td>
					<td><button type="submit" name="users" class="btn btn-primary">検索！</button></td>
				</tr>
			</table>
			<br>
			<table border="1">
				<tr>
					<td>　</td>
					<td>ユーザID</td>
					<td>パスワード</td>
					<td>ユーザ名</td>
					<td>権限</td>
				</tr>
				<tr th:each="user:${users}">
					<td><input type="checkbox" name="userIds" th:value="${user.userId}" /></td>
					<td th:text="${user.userId}"></td>
					<td>(閲覧不可)</td>
					<td th:text="${user.userName}"></td>
					<td th:text="${user.role}"></td>
				</tr>
			</table>
			<button type="submit" name="userEdit" class="btn btn-primary">ユーザ編集</button>
			<button type="submit" name="userLog" class="btn btn-primary">ユーザログ表示</button>
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		</form>
	</div>

</body>

</html>
