<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">

<head>
	<title>ユーザログ</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="header border-bottom mt-2">
			<h1 class="h2">ユーザログ画面</h1>
		</div>
		<h4 style="margin-bottom: 20px;"></h4>
		<br>
		<form method="post" th:action="@{/admin/G11}" enctype="multipart/form-data">
			<button name="export" type="submit">エクスポート</button>
			<br>
			<input type="file" name="file" accept=".csv" />
			<button name="import" type="submit">インポート</button>
			<br>
			<table border="1">
				<tr>
					<td>　</td>
					<td>ユーザID</td>
					<td>ユーザ名</td>
					<td>犬種</td>
					<td>残り体力</td>
					<td>得点</td>
					<td>実行日時</td>
				</tr>
				<tr th:each="result, stat : ${resultsSum}">
					<td>
						<input type="checkbox" name="ids" th:value="${result.id}" />
					</td>
					<td>
						<input type="text" th:value="${result.userId}" disabled="true" />
					</td>
					<td>
						<input type="text" th:value="${result.userName}" disabled="true" />
					</td>
					<td>
						<select>
							<option th:each="breed : ${breeds}" th:value="${breed.name}" th:text="${breed.name}"
								th:selected="${breed.name == result.breed}"></option>
						</select>
					</td>
					<td>
						<input type="text" th:value="${result.stamina}" />
					</td>
					<td>
						<input type="text" th:value="${result.point}" />
					</td>
					<td>
						<input type="hidden" th:value="${result.startedTime}" />
						<input type="text" th:value="${result.updateTime}" disabled="true" />
					</td>
				</tr>
			</table>
			<button type="submit" name="deleteLog" class="btn btn-primary">まとめてログを削除</button>
			<button type="submit" name="updateLog" class="btn btn-primary">まとめてログを更新</button>
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		</form>
	</div>
</body>

</html>
