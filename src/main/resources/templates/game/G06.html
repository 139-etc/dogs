<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">
<head>
  <title>散歩！　散歩！</title>
  <!-- 個別CSS読込 -->
  <link rel="stylesheet" th:href="@{/css/user/list.css}">
  <!-- 個別JS読込 -->
  <link rel="stylesheet" th:href="@{/webjars/datatables/css/jquery.dataTables.min.css}">
  <script th:src="@{/webjars/datatables/js/jquery.dataTables.min.js}" defer></script>
  <script th:src="@{/js/user/list.js}" defer></script>
</head>
<body>
  <div layout:fragment="content">
    <div class="header border-bottom">
      <h1 class="h2" >選択肢画面</h1>
    </div>
    <form method="post" th:action="@{/G05}">
    <h4 style="margin-bottom: 20px;">選択肢を選んでください！</h4>
		<table>
			<tr th:each="choice:${choices}">
				<td><input type="radio" th:text="${choice.choice}" th:value="${choice.id}"
				 name="choiceId"/></td>
			</tr>
		</table>
	<input type="submit" value="決定！" name="G06"/>
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </form>	
	<form method="post" th:action="@{/G07}">
	<input type="submit" value="帰宅！" name="return"/>
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
	</form>
  </div>
</div>
</body>
</html>
