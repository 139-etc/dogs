<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">
<head>
  <title>散歩！　散歩！</title>
  <!-- 個別CSS読込 -->
  <link rel="stylesheet" th:href="@{/css/user/list.css}">
  <!-- 個別JS読込 -->
  <link rel="stylesheet" th:href="@{/webjars/datatables/css/jquery.dataTables.min.css}">
  <script th:src="@{/webjars/datatables/js/jquery.dataTables.min.js}" defer></script>
  <script th:src="@{/js/user/list.js}" defer></script>
</head>
<body>
  <div layout:fragment="content">
    <div class="header border-bottom">
      <h1 class="h2" >結果画面</h1>
    </div>
    <h4 style="margin-bottom: 20px;">結果発表！</h4>
    <form  method="get" th:action="@{/G02}">
		<table th:object="${status}" border="1">
			<tr>
				<td>犬種</td>
				<td>残り体力</td>
				<td>ポイント</td>				
			</tr>
			<tr>
				<td th:text="*{breed}"></td>
				<td th:text="*{stamina}"></td>
				<td th:text="*{point}"></td>
			</tr>
		</table>
	<input type="submit" value="もう一度！"/>
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
	</form>
  </div>
</div>
</body>
</html>
