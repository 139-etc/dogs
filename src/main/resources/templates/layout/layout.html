<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	</meta>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- Bootstrap4 CSS -->
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/layout/layout.css}">

	<!-- jQuery（必ず先） -->
	<script th:src="@{/webjars/jquery/jquery.min.js}"></script>

	<!-- Bootstrap4 JS（jQuery の後） -->
	<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
	<title></title>
</head>

<body>
	<!-- ヘッダー -->
	<nav layout:replace="~{layout/header::header}"></nav>
	<!-- メニュー -->
	<div class="container-fluid">
		<div class="row">
			<nav class="col-sm-2 bg-light sidebar pt-2">
				<div layout:replace="~{layout/menu::menu}"></div>
			</nav>
		</div>
	</div>
	<!-- コンテンツ -->
	<div class="container-fluid">
		<div class="row">
			<div class="col-sm-10 offset-sm-2 main">
				<div layout:fragment="content"></div>
			</div>
		</div>
	</div>

	<!-- エラーモーダル（常に DOM に置く） -->
	<div class="modal fade" id="errorModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-body">
					<ul>
						<li th:each="msg : ${errorMessage}" th:text="${msg}"></li>
					</ul>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-dismiss="modal">閉じる</button>
				</div>
			</div>
		</div>
	</div>

	<!-- showErrorModal が true のときだけ実行される -->
	<script th:if="${showErrorModal}">
		document.addEventListener("DOMContentLoaded", function () {
			$('#errorModal').modal('show');
		});
	</script>

	<!-- セッション情報をリセットするメソッドに飛ぶ -->
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			$('#errorModal').on('hidden.bs.modal', function () {
				const token = document.querySelector('input[name="_csrf"]').value;

				fetch('/resetModalFlag', {
					method: 'POST',
					headers: {
						'X-CSRF-TOKEN': token
					}
				});

			});
		});
	</script>

</body>

</html>
